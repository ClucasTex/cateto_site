# Visita o Supabase de 3 em 3 dias para o projeto gratuito não entrar em pausa
# (os projetos gratuitos param ao fim de 1 semana sem atividade).
name: Manter Supabase ativo

on:
  schedule:
    - cron: "23 5 */3 * *"
  workflow_dispatch:

jobs:
  visita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: assets/config.js
          sparse-checkout-cone-mode: false
      - name: Ler ligação do assets/config.js e visitar
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]*' assets/config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]*' assets/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase ainda não configurado"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/comentarios?select=id&limit=1" -H "apikey: $KEY")
          echo "Resposta do Supabase: $code"
          [ "$code" = "200" ]
